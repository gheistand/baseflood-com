<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 312 64"
     role="img" aria-label="BaseFlood Engineering, PLLC">
  <title>BaseFlood Engineering, PLLC</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&amp;family=Inter:wght@500&amp;display=swap');
    </style>
  </defs>
  <!-- Wordmark — Base in navy, Flood in blue -->
  <text y="46"
        font-family="'Barlow Condensed','Arial Narrow',Arial,sans-serif"
        font-weight="700" font-size="50">
    <tspan fill="#1a3a5c">Base</tspan><tspan fill="#1e72b8">Flood</tspan>
  </text>
  <!-- Wave icon — 3 waves, dark→mid→light per spec -->
  <g transform="translate(205, 8)">
    <path d="M2 6 C 6 1, 10 1, 14 6 C 18 11, 22 11, 26 6 C 30 1, 34 1, 38 6 C 42 11, 46 11, 50 6"
          stroke="#1a3a5c" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <path transform="translate(0,13)"
          d="M2 6 C 6 1, 10 1, 14 6 C 18 11, 22 11, 26 6 C 30 1, 34 1, 38 6 C 42 11, 46 11, 50 6"
          stroke="#1872b4" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <path transform="translate(0,26)"
          d="M2 6 C 6 1, 10 1, 14 6 C 18 11, 22 11, 26 6 C 30 1, 34 1, 38 6 C 42 11, 46 11, 50 6"
          stroke="#1e72b8" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  </g>
  <!-- Tagline — Inter 500, uppercase, 0.22em letter-spacing, navy 62% -->
  <text x="2" y="60"
        font-family="'Inter','Segoe UI',Arial,sans-serif"
        font-weight="500" font-size="9.5"
        fill="#1a3a5c" opacity="0.62" letter-spacing="2.1">ENGINEERING, PLLC</text>
